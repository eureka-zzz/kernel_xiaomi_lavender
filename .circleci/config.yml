version: 2.1

executors:
  kernel_builder:
    docker:
      - image: cimg/base:current
    resource_class: large
    working_directory: ~/ksunext-build

jobs:
  build_kernel:
    executor: kernel_builder
    steps:
      - checkout:
          fetch-depth: 1

      - run:
          name: Install Dependencies and Cross Compiler
          command: |
            sudo apt update && sudo apt install -y \
              git curl bc build-essential ccache \
              flex bison libssl-dev libelf-dev \
              clang lld python3-pip \
              gcc-aarch64-linux-gnu \
              g++-aarch64-linux-gnu \
              binutils-aarch64-linux-gnu

      - run:
          name: Clone Kernel Source (Shallow)
          command: |
            git clone --depth=1 https://github.com/eureka-zzz/kernel_xiaomi_lavender.git ~/ksunext-build/kernel_source
            cd ~/ksunext-build/kernel_source
            echo "Kernel source cloned successfully!"

      - run:
          name: Apply KernelSU Next Patch
          command: |
            cd ~/ksunext-build/kernel_source
            curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next-susfs/kernel/setup.sh" | bash -s next-susfs

      - run:
          name: Build Kernel
          command: |
            cd ~/ksunext-build/kernel_source
            export ARCH=arm64
            export SUBARCH=arm64
            export CROSS_COMPILE=aarch64-linux-gnu-
            make lavender_defconfig
            make -j$(nproc)

      - store_artifacts:
          path: ~/ksunext-build/kernel_source/out/arch/arm64/boot/Image.gz-dtb
          destination: kernel/Image.gz-dtb

workflows:
  version: 2
  build_and_test:
    jobs:
      - build_kernel